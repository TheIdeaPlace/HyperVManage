name: Deploy bug-report relay

# Deploys relay/, the Cloudflare Worker that files Report a Bug's reports as GitHub issues. It
# runs here rather than on a PC because wrangler can't run on Windows on Arm. Setup, and what
# each secret is, are in relay/README.md.
#
# A push to main that changes the relay tests it, and deploys it once the relay is set up
# (the BUG_REPORT_RELAY_URL variable exists). Run it by hand for the first deploy.

on:
  workflow_dispatch:
    inputs:
      sync_secrets:
        description: "Also push the Worker's secrets from repository secrets"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test
        working-directory: relay
        run: node test/jwt.test.js

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.BUG_REPORT_RELAY_URL != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Deploy Worker
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # Opt-in: a run with a repository secret missing would otherwise replace working Worker
      # secrets with empty ones.
      - name: Sync Worker secrets
        if: inputs.sync_secrets
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_ID: ${{ secrets.RELAY_GITHUB_APP_ID }}
          INSTALLATION_ID: ${{ secrets.RELAY_GITHUB_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.RELAY_GITHUB_PRIVATE_KEY }}
          RELAY_KEY: ${{ secrets.BUG_REPORT_RELAY_KEY }}
        run: |
          for name in APP_ID INSTALLATION_ID PRIVATE_KEY RELAY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret for $name is empty. Set it before syncing."
              exit 1
            fi
          done
          # jq keeps the private key's line breaks intact. The file is in the runner's temp
          # folder, never the workspace or the log, and is removed straight after.
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg app_id "$APP_ID" \
            --arg installation_id "$INSTALLATION_ID" \
            --arg private_key "$PRIVATE_KEY" \
            --arg relay_key "$RELAY_KEY" \
            '{GITHUB_APP_ID: $app_id, GITHUB_INSTALLATION_ID: $installation_id, GITHUB_PRIVATE_KEY: $private_key, RELAY_KEY: $relay_key}' \
            > "$secrets_file"
          npx --yes wrangler@4 secret bulk "$secrets_file"
