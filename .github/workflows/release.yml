name: Release Hyper-V Manage

# A tag like v0.9.3 tests Hyper-V Manage, builds it for x64 and Arm64, signs the apps and the VM
# script with Azure Artifact Signing, packs a Velopack installer and update feed for each, checks
# every signature, and publishes a GitHub release:
#
#   git tag v0.9.3
#   git push origin v0.9.3
#
# A pull request, or a run by hand (Actions, Run workflow), does all of that except publish, and
# keeps the files as a workflow artifact to try. Its version is the project's with
# -test.<run>.<attempt> added, so a test install sorts below the release of that number and
# updates to it. A hand run signs only when asked; a pull request never does.
#
# Signing follows the other apps (The-Idea-Place-Projects/signing/windows.md): the job runs in the
# unprotected azure-signing environment, so GitHub's OIDC subject matches the federated credential
# Azure trusts, and azure/login exchanges that token for a short-lived credential. There is no
# certificate or secret to store; the three AZURE_* secrets are identifiers.
#
# Updates: an installed copy reads releases.<channel>.json from this repository's releases. x64 is
# Velopack's default channel, win; Arm64 is win-arm64, so neither is ever offered the other's
# package.

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the build (needs the azure-signing environment)'
        type: boolean
        default: false

permissions:
  contents: write   # create the release
  id-token: write   # the OIDC token azure/login exchanges for Azure credentials

env:
  VPK_VERSION: '1.2.161'   # the same as the Velopack package the app references

jobs:
  release:
    runs-on: windows-latest
    # Only a build that signs runs in the environment Azure trusts, so code on a pull request's
    # branch can never get a signing credential.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'azure-signing' || '' }}
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The keyboard tests take focus and only run when HYPERVMANAGE_RUN_INPUT_TESTS is set;
      # tests that need administrator rights skip themselves.
      - name: Test
        shell: pwsh
        run: dotnet test tests/HyperVManage.Tests -c Release

      # MSBuild reads the Version environment variable as the property, so the tag's version is
      # what About, the updater and the installer all see.
      - name: Choose the version
        shell: pwsh
        run: |
          if ($env:PUBLISH -eq 'true') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "The tag must be v<major>.<minor>.<patch>, not $env:GITHUB_REF_NAME." }
          } else {
            $base = (Select-Xml -Path src/HyperVManage/HyperVManage.csproj -XPath '/Project/PropertyGroup/Version').Node.InnerText
            if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "The project's <Version> must be <major>.<minor>.<patch>, not '$base'." }
            $version = "$base-test.${{ github.run_number }}.${{ github.run_attempt }}"
          }
          "Version=$version" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Version $version"

      # Only where the relay is set up (relay/README.md); otherwise the file keeps its empty
      # values and Report a Bug sends through GitHub's form in the browser.
      - name: Point Report a Bug at the relay
        if: env.SIGN == 'true' && vars.BUG_REPORT_RELAY_URL != ''
        shell: pwsh
        env:
          RELAY_URL: ${{ vars.BUG_REPORT_RELAY_URL }}
          RELAY_KEY: ${{ secrets.BUG_REPORT_RELAY_KEY }}
        run: |
          # Both go into a C# string, so only characters that can't end or change one.
          $uri = $null
          if (-not [Uri]::TryCreate($env:RELAY_URL, 'Absolute', [ref]$uri) -or $uri.Scheme -ne 'https' -or $env:RELAY_URL -notmatch '^[A-Za-z0-9:/._~-]+$') {
            throw 'BUG_REPORT_RELAY_URL must be a plain https address.'
          }
          if ($env:RELAY_KEY -notmatch '^[A-Za-z0-9_-]{20,}$') { throw 'BUG_REPORT_RELAY_KEY must be at least 20 letters, digits, - or _ (see relay/README.md).' }
          @"
          namespace HyperVManage.Services;
          public sealed partial class BugReportService
          {
              private const string RelayUrl = "$env:RELAY_URL";
              private const string RelayKey = "$env:RELAY_KEY";
          }
          "@ | Set-Content -Path src/HyperVManage/Services/BugReportService.Relay.cs -Encoding UTF8

      - name: Build both apps
        shell: cmd
        run: |
          call "Build App.cmd" x64 || exit /b 1
          call "Build App.cmd" arm64 || exit /b 1

      # An x64 exe in the Arm64 installer would install and run, emulated, and nothing would say so.
      - name: Check each build's processor
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $fs = [IO.File]::OpenRead("build\$arch\HyperVManage.exe")
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3c
              $fs.Position = $br.ReadInt32() + 4
              $machine = $br.ReadUInt16()
            } finally { $fs.Dispose() }
            $want = if ($arch -eq 'arm64') { 0xAA64 } else { 0x8664 }
            if ($machine -ne $want) { throw "build\$arch\HyperVManage.exe is for machine 0x$('{0:X4}' -f $machine), not $arch." }
            Write-Host "build\$arch\HyperVManage.exe is $arch."
          }

      - name: Azure login (code signing)
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Before packing: vpk leaves a signed file alone and signs the rest (Update.exe, Setup).
      # The repository's script stays unsigned; the app embeds it and a test checks it byte for
      # byte, so only the copy handed out is signed.
      - name: Stage the script
        shell: pwsh
        run: |
          $script = New-Item -ItemType Directory -Force dist\hyperv-rdp-vm
          Copy-Item 'hyperv-rdp-vm\New-HyperVRdpVM.ps1', 'hyperv-rdp-vm\Create VM.cmd', 'hyperv-rdp-vm\README.md' $script

      - name: Sign the apps and the script
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kellylford
          certificate-profile-name: kellyford-public
          files: |
            ${{ github.workspace }}\build\x64\HyperVManage.exe
            ${{ github.workspace }}\build\arm64\HyperVManage.exe
            ${{ github.workspace }}\dist\hyperv-rdp-vm\New-HyperVRdpVM.ps1
          file-digest: SHA256
          # Artifact Signing certificates last days; the timestamp keeps signatures valid after.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release's packages, so vpk can make a small delta update from it. Nothing to
      # fetch before the first release here, or for a channel's first release.
      - name: Fetch the previous release for delta updates
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($channel in 'win', 'win-arm64') {
            vpk download github --repoUrl https://github.com/${{ github.repository }} --token $env:GH_TOKEN --pre --channel $channel --outputDir Releases
            if ($LASTEXITCODE -ne 0) { Write-Host "No earlier $channel release to make a delta from." }
          }
          $global:LASTEXITCODE = 0

      - name: Write signing metadata
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $json = [ordered]@{
            Endpoint               = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'kellylford'
            CertificateProfileName = 'kellyford-public'
          } | ConvertTo-Json
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\signing-metadata.json", $json, (New-Object Text.UTF8Encoding $false))

      # Per-user, in %LocalAppData%\HyperVManage, so updates never need administrator rights
      # to install. Velopack names each channel's files with its name, so both fit in one release:
      #   win:       RELEASES, releases.win.json, assets.win.json, HyperVManage-<v>-full.nupkg
      #   win-arm64: RELEASES-win-arm64, releases.win-arm64.json, assets.win-arm64.json,
      #              HyperVManage-<v>-win-arm64-full.nupkg
      - name: Pack the installers
        shell: pwsh
        run: |
          $sign = @()
          if ($env:SIGN -eq 'true') { $sign = @('--azureTrustedSignFile', "$env:GITHUB_WORKSPACE\signing-metadata.json") }
          foreach ($arch in 'x64', 'arm64') {
            $channel = if ($arch -eq 'arm64') { 'win-arm64' } else { 'win' }
            # Installed, the app isn't one bundled exe: the bundle unpacks part of .NET into TEMP
            # on its first start, which took 23 seconds in the test VM (Velopack stops waiting for
            # its install hook at 30) and leaves files there another program could change.
            dotnet publish src/HyperVManage/HyperVManage.csproj -c Release -r "win-$arch" --self-contained true `
              -p:PublishSingleFile=false -p:DebugType=none -o "pack\$arch" -nologo -v quiet
            if ($LASTEXITCODE -ne 0) { throw "Publishing the $arch app for the installer failed." }
            $pack = "pack\$arch"
            vpk pack --packId HyperVManage --packVersion $env:Version --packDir $pack `
              --mainExe HyperVManage.exe --packTitle 'Hyper-V Manage' --packAuthors 'Kelly Ford' `
              --runtime "win-$arch" --channel $channel --shortcuts StartMenuRoot `
              --outputDir Releases @sign
            if ($LASTEXITCODE -ne 0) { throw "vpk pack ($arch) failed with exit code $LASTEXITCODE." }
            $setup = @(Get-ChildItem "Releases\*$channel-Setup.exe")
            if ($setup.Count -ne 1) { throw "Expected one $channel Setup.exe, found: $((Get-ChildItem Releases).Name -join ', ')" }
            Move-Item $setup[0].FullName "Releases\HyperVManage-Setup-$arch.exe"
          }
          Remove-Item Releases\*-Portable.zip -ErrorAction SilentlyContinue
          Get-ChildItem Releases | Select-Object Name, Length

      - name: Stage the release files
        shell: pwsh
        run: |
          Copy-Item 'build\x64\HyperVManage.exe' 'dist\HyperVManage-x64.exe'
          Copy-Item 'build\arm64\HyperVManage.exe' 'dist\HyperVManage-arm64.exe'
          Copy-Item 'Releases\HyperVManage-Setup-x64.exe', 'Releases\HyperVManage-Setup-arm64.exe' dist
          $label = if ($env:PUBLISH -eq 'true') { $env:GITHUB_REF_NAME } else { "v$env:Version" }
          Compress-Archive -Path 'dist\hyperv-rdp-vm' -DestinationPath "dist\New-HyperVRdpVM-$label.zip" -Force
          Remove-Item -Recurse dist\hyperv-rdp-vm
          Get-ChildItem dist | Select-Object Name, Length

      # Nothing unsigned leaves a signed build.
      - name: Check every signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist\New-HyperVRdpVM-*.zip).FullName -DestinationPath zipcheck
          $files = @(Get-ChildItem dist\*.exe) + @(Get-Item zipcheck\hyperv-rdp-vm\New-HyperVRdpVM.ps1)
          # Inside this release's full packages too: the app, and Velopack's Update.exe. Delta
          # packages hold binary differences, not files to check; they rebuild these same files.
          foreach ($pkg in Get-ChildItem Releases\*-full.nupkg | Where-Object Name -like "*-$env:Version-*") {
            $out = "pkgcheck\$($pkg.BaseName)"
            Expand-Archive $pkg.FullName -DestinationPath $out -Force
            $files += Get-ChildItem $out -Recurse -Include *.exe, HyperVManage.dll
          }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.FullName)`n  status:  $($sig.Status)`n  signer:  $($sig.SignerCertificate.Subject)`n  stamped: $([bool]$sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { $bad++ }
          }
          if ($bad) { throw "$bad file(s) aren't validly signed and timestamped." }

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-manage-${{ env.Version }}${{ env.SIGN != 'true' && '-unsigned' || '' }}
          path: |
            dist
            Releases
          if-no-files-found: error
          retention-days: 14

      - name: Create the release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:Version
          $notesFile = "docs\release-notes\v$version.md"
          $notes = if (Test-Path $notesFile) { (Get-Content $notesFile -Raw) + "`n" } else { '' }
          $notes += @'
          ## Download

          - **HyperVManage-Setup-x64.exe** for Intel and AMD PCs, or **HyperVManage-Setup-arm64.exe**
            for Arm PCs, installs Hyper-V Manage for you, with a Start menu entry, and keeps it up to
            date: an update downloads while you use it and is installed when you close it, or straight
            away from Help, Check for Updates.
          - **HyperVManage-x64.exe** or **HyperVManage-arm64.exe** is the same app as one program to
            run from anywhere, with nothing to install. It tells you when there's a new version, but
            doesn't update itself.
          - **The zip** holds New-HyperVRdpVM.ps1, the script the app runs to build a VM, for the
            command line. Extract it and open Create VM.cmd.

          It needs Windows 10 or 11 Pro, Enterprise or Education with Hyper-V turned on, and asks for
          administrator rights when it starts. Everything is signed by "kelly ford"; Windows
          SmartScreen may still ask about a new download until the publisher builds up reputation.

          Found a problem? Help, Report a Bug. Read the [README](https://github.com/kellylford/HyperVManage#readme).
          '@
          $pre = @()
          if ($version.StartsWith('0.')) {
            $pre = @('--prerelease')
            $notes = @'
          **This is a pre-release.** Building VMs, connecting, Open Console, Save Connection File,
          Pause and Delete have been used on real Hyper-V on x64 and Arm64 PCs; Settings,
          Checkpoint, Apply Checkpoint and Clone so far only against the pretend VMs of `--demo`.
          Every VM is made with the user name **vmuser** and password **vmadmin** unless you choose
          others, and joins your network with Remote Desktop on, so choose your own password on a
          network you share.

          '@ + $notes
          }
          Set-Content notes.md $notes
          # The update feed: both channels' indexes and every package, deltas included. Named one by
          # one, so a file vpk stops making fails the release instead of breaking updates quietly.
          $feed = @('RELEASES', 'releases.win.json', 'assets.win.json', 'RELEASES-win-arm64', 'releases.win-arm64.json', 'assets.win-arm64.json') |
            ForEach-Object { "Releases\$_" }
          foreach ($f in $feed) { if (-not (Test-Path $f)) { throw "$f is missing." } }
          # This release's packages only: the previous release's full package, fetched above to make
          # the deltas, is already on that release.
          $packages = @(Get-ChildItem Releases\*.nupkg | Where-Object Name -like "*-$version-*" | ForEach-Object FullName)
          if ($packages.Count -lt 2) { throw "Expected this release's packages for both processors, found: $($packages -join ', ')" }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist | ForEach-Object FullName) $feed $packages `
            --title "Hyper-V Manage $version" --notes-file notes.md @pre
